name: CI

# Runs on GitHub-hosted runners: this repo is public, so they are free, and
# self-hosted runners must never run code from public pull requests.
# See docs/decisions/0002-ci-on-github-hosted-runners.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest Python the Resolve install supports; 3.13 is current.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-resolve.txt
      - run: python -m pip install -r requirements-resolve.txt
      - run: python -m unittest discover -s tests -v

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The app (crates/app) builds against GTK4 and libadwaita. Runners hosted
      # on AWS get the us-east-2.ec2 Ubuntu mirror, which crawled at ~120 kB/s
      # and stalled every attempt; the Azure mirror the other runners use
      # fetched the same packages in 6 s. So pin apt to it (archive.ubuntu.com
      # as fallback), and still time-limit and retry each attempt.
      - name: Install GTK
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get "${apt_opts[@]}" update -q &&
               timeout 150 sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev; then
              exit 0
            fi
            echo "::warning::GTK install attempt $attempt failed or stalled; retrying"
            sleep 5
          done
          exit 1
      # The render and auto-markers tests need ffmpeg (with prores_aw and
      # libx264) and must not skip here. A static build from GitHub releases,
      # cached, instead of apt: apt took 8+ minutes and once hung.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/ffmpeg
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=1
      - name: Put ffmpeg on PATH
        run: |
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -hide_banner -encoders | grep -E "prores_aw|libx264"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          REQUIRE_FFMPEG: "1"

  parity:
    name: Python/Rust parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-resolve.txt
      - run: python -m pip install -r requirements-resolve.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p timer-cli
      - run: scripts/parity.sh
