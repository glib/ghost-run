name: CI

# Runs on GitHub-hosted runners: this repo is public, so they are free, and
# self-hosted runners must never run code from public pull requests.
# See docs/decisions/0002-ci-on-github-hosted-runners.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest Python the Resolve install supports; 3.13 is current.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-resolve.txt
      - run: python -m pip install -r requirements-resolve.txt
      - run: python -m unittest discover -s tests -v
