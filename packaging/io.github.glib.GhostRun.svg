<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Ghost Run: a ghost rider streaking past a split timer. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26303a"/>
      <stop offset="1" stop-color="#14191f"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- speed trails -->
  <rect x="14" y="52" width="44" height="6" rx="3" fill="url(#trail)"/>
  <rect x="22" y="66" width="38" height="6" rx="3" fill="url(#trail)"/>
  <rect x="16" y="80" width="40" height="6" rx="3" fill="url(#trail)"/>
  <!-- ghost -->
  <path d="M56 98 V62 a26 26 0 0 1 52 0 V98 l-8.7 -7 -8.6 7 -8.7 -7 -8.7 7 -8.6 -7 z"
        fill="#eef4f8" fill-opacity="0.92"/>
  <circle cx="74" cy="62" r="5" fill="#14191f"/>
  <circle cx="92" cy="62" r="5" fill="#14191f"/>
  <!-- split box -->
  <rect x="20" y="20" width="44" height="20" rx="6" fill="#16a34a"/>
  <text x="42" y="35" font-family="monospace" font-size="13" font-weight="700"
        text-anchor="middle" fill="#ffffff">-0.42</text>
</svg>
