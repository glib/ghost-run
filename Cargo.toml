[workspace]
resolver = "3"
members = [
    "crates/timer-core",
    "crates/timer-cli",
    "crates/timer-render",
    "crates/timer-align",
    "crates/ingest",
    "crates/library",
    "crates/app",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "signal", "sync"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
