[workspace]
resolver = "3"
members = ["crates/timer-core", "crates/timer-cli"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
