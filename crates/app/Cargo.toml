[package]
name = "ghost-run"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version = "1.88"
description = "Ghost Run: import, time and review your race runs"

[[bin]]
name = "ghost-run"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
ingest = { path = "../ingest" }
library = { path = "../library" }
timer-core = { path = "../timer-core" }
timer-render = { path = "../timer-render" }
fontdue = "0.9"
resvg = { version = "0.45.1", default-features = false }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
