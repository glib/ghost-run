[package]
name = "ghost-run"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version = "1.88"
description = "Ghost Run: import, time and review your race runs"

[[bin]]
name = "ghost-run"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
ingest = { path = "../ingest" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[lints]
workspace = true
